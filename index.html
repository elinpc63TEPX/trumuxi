<!-- TRUMUXI LIVE COINS - PART 1 -->

<section id="live-coins" style="
padding:50px 15px;
background:linear-gradient(180deg,#080808,#151005);
color:white;
text-align:center;
">

<h2 style="
font-size:34px;
color:#ffd34d;
margin-bottom:10px;
">
🔥 TOP 10 CRYPTO
</h2>

<p style="
color:#aaa;
margin-bottom:30px;
">
Live Crypto Market
</p>

<div id="coin-list" style="
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px;
max-width:1100px;
margin:auto;
">

</div>

</section><script>
const coins = [
  {name:"Bitcoin", symbol:"BTC", color:"#f7931a"},
  {name:"Ethereum", symbol:"ETH", color:"#627eea"},
  {name:"Tether", symbol:"USDT", color:"#26a17b"},
  {name:"BNB", symbol:"BNB", color:"#f3ba2f"},
  {name:"Solana", symbol:"SOL", color:"#9945ff"},
  {name:"XRP", symbol:"XRP", color:"#ffffff"},
  {name:"Dogecoin", symbol:"DOGE", color:"#c2a633"},
  {name:"Cardano", symbol:"ADA", color:"#0033ad"},
  {name:"TRUMUXI", symbol:"TRMX", color:"#ffd34d"},
  {name:"Polkadot", symbol:"DOT", color:"#e6007a"}
];

const coinList = document.getElementById("coin-list");

coins.forEach((coin, index) => {

  const card = document.createElement("div");

  card.style.cssText = `
    background:linear-gradient(145deg,#171717,#080808);
    border:1px solid #3a2b0c;
    border-radius:18px;
    padding:22px 15px;
    box-shadow:0 0 20px rgba(255,211,77,.08);
    cursor:pointer;
    transition:.3s;
  `;

  card.innerHTML = `
    <div style="
      width:60px;
      height:60px;
      border-radius:50%;
      margin:auto auto 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:${coin.color};
      color:#000;
      font-weight:bold;
      font-size:17px;
    ">
      ${coin.symbol.substring(0,3)}
    </div>

    <h3 style="margin-bottom:8px;">
      ${coin.name}
    </h3>

    <div style="
      color:#ffd34d;
      font-size:20px;
      font-weight:bold;
    ">
      $<span id="price-${index}">0.00</span>
    </div>

    <div style="
      margin-top:8px;
      color:#888;
      font-size:13px;
    ">
      Click for chart
    </div>
  `;

  card.onclick = () => {
    alert(coin.name + " (" + coin.symbol + ") chart will open here.");
  };

  card.onmouseenter = () => {
    card.style.transform = "translateY(-6px)";
    card.style.boxShadow = "0 0 30px rgba(255,211,77,.25)";
  };

  card.onmouseleave = () => {
    card.style.transform = "translateY(0)";
    card.style.boxShadow = "0 0 20px rgba(255,211,77,.08)";
  };

  coinList.appendChild(card);
});
</script><script>
const coinIds = [
  "bitcoin",
  "ethereum",
  "tether",
  "binancecoin",
  "solana",
  "ripple",
  "dogecoin",
  "cardano",
  "trumuxi",
  "polkadot"
];

async function updatePrices() {

  try {

    const url =
      "https://api.coingecko.com/api/v3/simple/price" +
      "?ids=" + coinIds.join(",") +
      "&vs_currencies=usd";

    const response = await fetch(url);
    const data = await response.json();

    coinIds.forEach((id, index) => {

      const priceBox =
        document.getElementById("price-" + index);

      if (!priceBox) return;

      if (data[id] && data[id].usd !== undefined) {

        let price = data[id].usd;

        if (price < 1) {
          price = price.toFixed(6);
        } else {
          price = price.toLocaleString(
            "en-US",
            {
              maximumFractionDigits: 2
            }
          );
        }

        priceBox.textContent = price;

      } else {

        priceBox.textContent = "N/A";

      }

    });

  } catch (error) {

    console.log("Price update error:", error);

  }
}

updatePrices();

setInterval(
  updatePrices,
  30000
);
</script><style>

</style><!-- TRUMUXI COIN CHART MODAL -->

<div id="chartModal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.88);
z-index:99999;
padding:20px;
align-items:center;
justify-content:center;
">

  <div style="
  width:100%;
  max-width:800px;
  background:#0b0b0b;
  border:1px solid #66501c;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 50px rgba(255,211,77,.15);
  position:relative;
  ">

    <button onclick="closeChart()" style="
    position:absolute;
    right:12px;
    top:10px;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#222;
    color:#ffd34d;
    font-size:20px;
    cursor:pointer;
    ">×</button>

    <h2 id="chartTitle" style="
    color:#ffd34d;
    text-align:center;
    margin:10px 0 20px;
    ">
    Crypto Chart
    </h2>

    <div style="
    height:300px;
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:20px;
    border:1px solid #292929;
    border-radius:15px;
    background:linear-gradient(180deg,#151515,#080808);
    " id="chartBars">
    </div>

    <p style="
    text-align:center;
    color:#888;
    margin-top:15px;
    font-size:13px;
    ">
    TRUMUXI LIVE MARKET
    </p>

  </div>
</div>

<script>

function openChart(name){

  const modal =
    document.getElementById("chartModal");

  const title =
    document.getElementById("chartTitle");

  const bars =
    document.getElementById("chartBars");

  title.textContent = name + " — Price Chart";

  bars.innerHTML = "";

  for(let i = 0; i < 35; i++){

    const bar =
      document.createElement("div");

    const height =
      25 + Math.random() * 75;

    bar.style.cssText = `
      flex:1;
      height:${height}%;
      min-width:4px;
      background:linear-gradient(
        180deg,
        #ffd34d,
        #8c6500
      );
      border-radius:5px 5px 0 0;
      box-shadow:0 0 8px rgba(255,211,77,.18);
    `;

    bars.appendChild(bar);
  }

  modal.style.display = "flex";
}

function closeChart(){

  document.getElementById(
    "chartModal"
  ).style.display = "none";

}

document
  .getElementById("coin-list")
  .addEventListener("click", function(e){

    const card =
      e.target.closest("#coin-list > div");

    if(!card) return;

    const name =
      card.querySelector("h3").textContent;

    openChart(name);

  });

document
  .getElementById("chartModal")
  .addEventListener("click", function(e){

    if(e.target === this){
      closeChart();
    }

  });

</script>
