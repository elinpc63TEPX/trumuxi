<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRUMUXI - The Future of Digital Currency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: rgba(10, 10, 10, 0.95);
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 20px;
      color: #f0b90b;
    }

    .logo-circle {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f0b90b, #d4a017);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #000;
      font-size: 18px;
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      color: #ccc;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #f0b90b;
    }

    .trmx-btn {
      background: linear-gradient(135deg, #f0b90b, #d4a017);
      color: #000;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .trmx-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(240, 185, 11, 0.4);
    }

    /* Main Container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 30px 24px 60px;
    }

    /* Hero */
    .hero-section {
      margin-bottom: 28px;
    }

    .hero-card {
      background: linear-gradient(145deg, #141414, #0d0d0d);
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 50px 48px;
      position: relative;
      overflow: hidden;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(240,185,11,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-label {
      font-size: 13px;
      letter-spacing: 2px;
      color: #f0b90b;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 56px;
      font-weight: 800;
      color: #f0b90b;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .hero-desc {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 28px;
      max-width: 420px;
    }

    .explore-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #f0b90b, #d4a017);
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      width: fit-content;
      transition: all 0.2s;
    }

    .explore-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(240,185,11,0.45);
    }

    .glow-t {
      position: absolute;
      right: 80px;
      top: 50%;
      transform: translateY(-50%);
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, #f0b90b 0%, #d4a017 40%, transparent 70%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 68px;
      font-weight: 800;
      color: #000;
      box-shadow: 0 0 60px rgba(240,185,11,0.5);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(240,185,11,0.4); }
      50% { box-shadow: 0 0 80px rgba(240,185,11,0.7); }
    }

    /* Leaders */
    .leaders {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .leader-card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      transition: all 0.25s;
      cursor: pointer;
    }

    .leader-card:hover {
      border-color: #f0b90b;
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(240,185,11,0.15);
    }

    .leader-flag {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      background: #1a1a1a;
      border: 2px solid #333;
    }

    .leader-name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .leader-token {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }

    .leader-tag {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #f0b90b;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
    }

    /* Bottom Grid */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr 0.8fr;
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
    }

    .card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .community-text {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .social-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .telegram {
      background: linear-gradient(135deg, #f0b90b, #d4a017);
      color: #000;
    }

    .twitter {
      background: #1a1a1a;
      color: #f0b90b;
      border: 1px solid #333;
    }

    .social-btn:hover {
      transform: translateY(-2px);
    }

    /* Chart */
    .chart-container {
      height: 180px;
      position: relative;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .chart-price {
      position: absolute;
      top: 0;
      right: 0;
      font-size: 14px;
      font-weight: 600;
      color: #f0b90b;
    }

    /* Visitors */
    .visitors-number {
      font-size: 48px;
      font-weight: 800;
      color: #f0b90b;
      text-align: center;
      margin: 20px 0 8px;
    }

    .visitors-label {
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    /* Top 10 */
    .top10-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top10-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .coin-card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 18px 14px;
      transition: all 0.2s;
    }

    .coin-card:hover {
      border-color: #f0b90b;
      transform: translateY(-3px);
    }

    .coin-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .coin-card-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .coin-card-name {
      font-weight: 600;
      font-size: 14px;
    }

    .coin-card-symbol {
      font-size: 11px;
      color: #777;
    }

    .coin-card-price {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .coin-card-change {
      font-size: 13px;
      margin-bottom: 12px;
    }

    .up { color: #0f0; }
    .down { color: #f44; }

    .view-btn {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #f0b90b;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-btn:hover {
      background: #f0b90b;
      color: #000;
      border-color: #f0b90b;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 30px;
      color: #555;
      font-size: 13px;
      border-top: 1px solid #1a1a1a;
      margin-top: 20px;
    }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: #111;
      border: 1px solid #333;
      border-radius: 20px;
      width: 90%;
      max-width: 560px;
      padding: 28px;
      position: relative;
      transform: translateY(30px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #aaa;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: #f0b90b;
      color: #000;
      border-color: #f0b90b;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .modal-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 700;
    }

    .modal-symbol {
      font-size: 14px;
      color: #888;
    }

    .modal-price {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .modal-change {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .modal-chart-container {
      height: 220px;
      background: #0a0a0a;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #222;
    }

    .modal-chart-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .leaders { grid-template-columns: repeat(2, 1fr); }
      .bottom-grid { grid-template-columns: 1fr; }
      .top10-grid { grid-template-columns: repeat(3, 1fr); }
      .glow-t { display: none; }
    }

    @media (max-width: 700px) {
      header { padding: 12px 16px; }
      nav { display: none; }
      .top10-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-title { font-size: 36px; }
      .hero-card { padding: 36px 24px; }
      .leaders { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-circle">T</
