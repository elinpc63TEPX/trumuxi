<script>

const coins = [
"bitcoin",
"ethereum",
"tether",
"binancecoin",
"solana",
"usd-coin",
"xrp",
"dogecoin",
"cardano",
"avalanche-2"
];

async function loadPrices(){

try{

const response = await fetch(
"https://api.coingecko.com/api/v3/simple/price?ids="
+ coins.join(",")
+ "&vs_currencies=usd"
);

const data = await response.json();

coins.forEach(coin => {

const element =
document.getElementById(coin + "-price");

if(element && data[coin]){

element.textContent =
"$" + data[coin].usd;

}

});

}catch(error){

console.log("Price error:",error);

}

}

let chart;

async function showChart(coin){

const title =
document.getElementById("chartTitle");

const status =
document.getElementById("chartStatus");

title.textContent =
coin.toUpperCase() + " - 7 Day Chart";

status.textContent = "Loading chart...";

try{

const response = await fetch(
"https://api.coingecko.com/api/v3/coins/"
+ coin
+ "/market_chart?vs_currency=usd&days=7"
);

const data = await response.json();

const prices = data.prices;

const labels = prices.map(item =>
new Date(item[0]).toLocaleDateString()
);

const values = prices.map(item => item[1]);

if(chart){

chart.destroy();

}

const ctx =
document.getElementById("marketChart")
.getContext("2d");

chart = new Chart(ctx,{

type:"line",

data:{

labels:labels,

datasets:[{

label:coin.toUpperCase(),

data:values,

borderWidth:2,

fill:false,

tension:0.3

}]

},

options:{

responsive:true,

plugins:{

legend:{

display:true

}

}

}

});

status.textContent =
"Chart updated successfully.";

}catch(error){

status.textContent =
"Unable to load chart.";

console.log(error);

}

}

loadPrices();

setInterval(loadPrices,30000);

</script>
